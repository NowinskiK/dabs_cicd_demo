# The main pipeline for InitDemo

resources:
  pipelines:
    InitDemo_etl:
      name: InitDemo_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/InitDemo_etl"

      libraries:
        - glob:
            include: ../src/InitDemo_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

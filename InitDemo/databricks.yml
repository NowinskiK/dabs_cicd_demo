# This is a Declarative Automation Bundle definition for InitDemo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: InitDemo
  uuid: 4d90f54f-c879-49e1-aa61-9e01b6718147

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405614498669357.17.azuredatabricks.net
    variables:
      catalog: demo1
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405614498669357.17.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/kamil.nowinski@cloudformations.org to make sure we only have a single copy.
      root_path: /Workspace/Users/kamil.nowinski@cloudformations.org/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: demo1
      schema: prod
    permissions:
      - user_name: kamil.nowinski@cloudformations.org
        level: CAN_MANAGE

# dabs_cicd_demo_dev.yaml
name: Deploy to prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4  # Update to the latest version

      - uses: databricks/setup-cli@main

      - run: databricks bundle deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod

  workflow_run:
    name: "Job run for the workflow"
    runs-on: ubuntu-latest
    environment: prod

    needs:
      - deploy

    steps:
      - uses: actions/checkout@v4  # Update to the latest version

      - uses: databricks/setup-cli@main

      - shell: bash
        name: Run pipeline update
        run: |
          databricks bundle run demo_dabs_project_job --refresh-all 2>&1 | tee output.log
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod
  

  dbt_workflow_run:
    name: "DBT Job run for the workflow"
    runs-on: ubuntu-latest
    environment: prod

    needs:
      - deploy

    steps:
      - uses: actions/checkout@v4  # Update to the latest version

      - uses: databricks/setup-cli@main

      - shell: bash
        name: Run pipeline update
        run: |
          databricks bundle run demo_dabs_project_dbt_job --refresh-all 2>&1 | tee output.log
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod
    
